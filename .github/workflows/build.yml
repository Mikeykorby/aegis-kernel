name: Build Aegis Kernel

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve MSBuild + SDK + WDK paths
        id: env
        shell: pwsh
        run: |
          # MSBuild (not on PATH by default on the VS image)
          $msb = &"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -requires Microsoft.Component.MSBuild -find "**\MSBuild\Current\Bin\MSBuild.exe"
          if (-not $msb) { throw "MSBuild not found" }
          echo "MSBUILD=$msb" >> $env:GITHUB_OUTPUT
          Write-Host "MSBuild = $msb"

          # Windows SDK include + um libs (bcrypt.lib / kernel32.lib) for the agent.
          $sdkInc = Get-Item "C:\Program Files (x86)\Windows Kits\10\Include\*" -ErrorAction SilentlyContinue `
                      | Sort-Object Name | Select-Object -Last 1
          if (-not $sdkInc) { throw "Windows SDK Include not found" }
          $SDK_INC = $sdkInc.FullName

          $sdkLibRoot = Get-Item "C:\Program Files (x86)\Windows Kits\10\Lib\*" -ErrorAction SilentlyContinue `
                      | Sort-Object Name | Select-Object -Last 1
          $SDK_LIB = (Get-ChildItem $sdkLibRoot.FullName -Recurse -Directory -Filter x64 | Where-Object {
                          $_.Parent.Name -eq 'um' -and (Test-Path (Join-Path $_.FullName 'kernel32.lib'))
                       } | Select-Object -First 1).FullName
          if (-not $SDK_LIB) { throw "SDK um\x64 libs not found" }
          echo "SDK_INC=$SDK_INC" >> $env:GITHUB_OUTPUT
          echo "SDK_LIB=$SDK_LIB" >> $env:GITHUB_OUTPUT
          Write-Host "SDK_INC = $SDK_INC"
          Write-Host "SDK_LIB = $SDK_LIB"

          # Kernel-mode WDK package (km/fltKernel.h + km/x64/fltMgr.lib) for the driver.
          # Download the NuGet directly with curl.exe (bundled with Git for Windows;
          # reliable -L redirect handling, unlike Invoke-WebRequest against nuget.org).
          $WDK_VER = "10.0.26100.6584"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/$WDK_VER/microsoft.windows.wdk.x64.$WDK_VER.nupkg"
          curl.exe -fL --retry 3 -o wdk.nupkg "$url"
          if (-not (Test-Path wdk.nupkg)) { throw "WDK download failed" }
          Expand-Archive -Path wdk.nupkg -DestinationPath wdkpkg -Force
          $pkg = (Get-ChildItem wdkpkg -Directory | Select-Object -First 1).FullName
          Write-Host "WDK pkg dir = $pkg"
          Get-ChildItem $pkg -Recurse -Filter fltKernel.h | ForEach-Object { Write-Host "found hdr: $($_.FullName)" }
          # headers live at <pkg>/c/Include/<ver>/km ; libs at <pkg>/c/Lib/<ver>/km/x64
          $WDK_INC = (Get-ChildItem $pkg -Recurse -Directory -Filter km | Where-Object {
                          (Test-Path (Join-Path $_.FullName 'fltKernel.h'))
                       } | Select-Object -First 1).FullName
          $WDK_KMLIB = (Get-ChildItem $pkg -Recurse -Directory -Filter x64 | Where-Object {
                          $_.Parent.Name -eq 'km' -and (Test-Path (Join-Path $_.FullName 'fltMgr.lib'))
                       } | Select-Object -First 1).FullName
          if (-not $WDK_INC -or -not $WDK_KMLIB) { throw "WDK include/lib not found in package" }
          echo "WDK_INC=$WDK_INC"     >> $env:GITHUB_OUTPUT
          echo "WDK_KMLIB=$WDK_KMLIB" >> $env:GITHUB_OUTPUT
          Write-Host "WDK_INC = $WDK_INC"
          Write-Host "WDK_KMLIB = $WDK_KMLIB"

      - name: Build kernel driver (mini-filter)
        shell: pwsh
        run: |
          $msb = "${{ steps.env.outputs.MSBUILD }}"
          & $msb kernel/aegis_kernel.vcxproj /p:Configuration=Release /p:Platform=x64 `
               /p:WDK_INC="${{ steps.env.outputs.WDK_INC }}" /p:WDK_KMLIB="${{ steps.env.outputs.WDK_KMLIB }}"

      - name: Build user-mode agent
        shell: pwsh
        run: |
          $msb = "${{ steps.env.outputs.MSBUILD }}"
          & $msb agent/aegis_agent.vcxproj /p:Configuration=Release /p:Platform=x64 `
               /p:SDK_INC="${{ steps.env.outputs.SDK_INC }}" /p:SDK_LIB="${{ steps.env.outputs.SDK_LIB }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aegis-kernel-binaries
          path: |
            kernel/x64/Release/aegis_kernel.sys
            agent/x64/Release/aegis_agent.exe
          if-no-files-found: warn
