name: Build Aegis Kernel

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve MSBuild + WDK/SDK paths
        id: env
        shell: pwsh
        run: |
          # --- MSBuild (VS2026 image doesn't put it on PATH) ---
          $msb = &"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -requires Microsoft.Component.MSBuild `
                  -find "MSBuild\Current\Bin\amd64\MSBuild.exe" | Select-Object -First 1
          if (-not $msb) { $msb = "msbuild.exe" }
          echo "MSBUILD=$msb" >> $env:GITHUB_OUTPUT
          Write-Host "MSBuild = $msb"

          # --- Windows SDK (user-mode fltUser.h / bcrypt.lib / kernel32.lib) ---
          $sdk = Get-Item "C:\Program Files (x86)\Windows Kits\10\Include\*" -ErrorAction SilentlyContinue `
                 | Sort-Object Name | Select-Object -Last 1
          $SDK_INC   = $sdk.FullName
          $SDK_KMLIB = "C:\Program Files (x86)\Windows Kits\10\Lib\$($sdk.Name)\km\x64"
          $SDK_UMLIB = "C:\Program Files (x86)\Windows Kits\10\Lib\$($sdk.Name)\um\x64"
          if (-not (Test-Path $SDK_KMLIB)) { throw "SDK km lib not found" }
          echo "SDK_INC=$SDK_INC"   >> $env:GITHUB_OUTPUT
          echo "SDK_KMLIB=$SDK_KMLIB" >> $env:GITHUB_OUTPUT
          echo "SDK_UMLIB=$SDK_UMLIB" >> $env:GITHUB_OUTPUT

          # --- Kernel-mode WDK package (km/fltKernel.h + km/x64/fltMgr.lib) ---
          nuget install Microsoft.Windows.WDK.x64 -Version 10.0.28000.2526 -ExcludeVersion -OutputDirectory wdkpkg | Out-Null
          $pkg = (Get-ChildItem wdkpkg\Microsoft.Windows.WDK.x64 -Directory | Select-Object -First 1).FullName
          $WDK_INC   = (Get-ChildItem $pkg -Recurse -Directory -Filter km | Where-Object {
                          (Test-Path (Join-Path $_.FullName 'fltKernel.h')) -and
                          (Test-Path (Join-Path $_.Parent.FullName 'shared') -PathType Container)
                       } | Select-Object -First 1).Parent.FullName
          $WDK_KMLIB = (Get-ChildItem $pkg -Recurse -Directory -Filter x64 | Where-Object {
                          $_.Parent.Name -eq 'km' -and (Test-Path (Join-Path $_.FullName 'fltMgr.lib'))
                       } | Select-Object -First 1).FullName
          if (-not $WDK_INC -or -not $WDK_KMLIB) { throw "WDK include/lib not found in package" }
          echo "WDK_INC=$WDK_INC"   >> $env:GITHUB_OUTPUT
          echo "WDK_KMLIB=$WDK_KMLIB" >> $env:GITHUB_OUTPUT
          Write-Host "SDK_INC   = $SDK_INC"
          Write-Host "SDK_KMLIB = $SDK_KMLIB"
          Write-Host "SDK_UMLIB = $SDK_UMLIB"
          Write-Host "WDK_INC   = $WDK_INC"
          Write-Host "WDK_KMLIB = $WDK_KMLIB"

      - name: Build kernel driver (mini-filter)
        shell: pwsh
        run: |
          & "${{ steps.env.outputs.MSBUILD }}" kernel/aegis_kernel.vcxproj `
            /p:Configuration=Release /p:Platform=x64 `
            /p:WDK_INC="${{ steps.env.outputs.WDK_INC }}" `
            /p:WDK_KMLIB="${{ steps.env.outputs.WDK_KMLIB }}" `
            /p:SDK_INC="${{ steps.env.outputs.SDK_INC }}" `
            /p:SDK_KMLIB="${{ steps.env.outputs.SDK_KMLIB }}" `
            /p:SDK_UMLIB="${{ steps.env.outputs.SDK_UMLIB }}"

      - name: Build user-mode agent
        shell: pwsh
        run: |
          & "${{ steps.env.outputs.MSBUILD }}" agent/aegis_agent.vcxproj `
            /p:Configuration=Release /p:Platform=x64 `
            /p:SDK_INC="${{ steps.env.outputs.SDK_INC }}" `
            /p:SDK_KMLIB="${{ steps.env.outputs.SDK_KMLIB }}" `
            /p:SDK_UMLIB="${{ steps.env.outputs.SDK_UMLIB }}"

      - name: Upload binaries + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-kernel-artifacts
          path: |
            kernel/x64/Release/aegis_kernel.sys
            kernel/x64/Release/aegis_kernel.inf
            agent/x64/Release/aegis_agent.exe
            wdkpkg/
          if-no-files-found: warn
